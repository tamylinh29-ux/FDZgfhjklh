[package]
name = "allos-emulator"
version = "0.1.0"
description = "Lightweight multi-architecture QEMU virtual machine manager"
authors = ["AllOS Emulator Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
